; The ending year is explicit so historical workpapers keep their selected dates.
[Period]
FinancialYearEnding=2026
Quarter=4

; Leave Applications blank for all applications, or list executable names.
; Example: Applications=EXCEL.EXE,WINWORD.EXE
[Scope]
Applications=

; Public holidays for BusinessDueDate: ATO counts a holiday for the whole of any State or
; Territory; ACT, NSW, NT, QLD, SA, TAS, VIC or WA counts only that one. It does not count
; 28 September, 3 November, 24 December or 31 December 2026, where the ATO's table gives a
; later date; see docs/commands.md.
[Holidays]
State=

; ^ = Ctrl, ! = Alt, + = Shift, # = Windows. Leave a value blank to disable it.
[Hotkeys]
YearEnd=Insert
Today=^!d
QuarterEnd=^!q
FinancialYear=^!y
; Enable the searchable picker with Picker=^!Space after reviewing clipboard policy.
Picker=
