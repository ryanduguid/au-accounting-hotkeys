; The ending year is explicit so historical workpapers keep their selected dates.
[Period]
FinancialYearEnding=2026
Quarter=4

; Leave Applications blank for all applications, or list executable names.
; Example: Applications=EXCEL.EXE,WINWORD.EXE
[Scope]
Applications=

; Public holidays for BusinessDueDate: ATO counts a holiday for the whole of any State or
; Territory; ACT, NSW, NT, QLD, SA, TAS, VIC or WA counts only that one. The holidays are
; every day in the ATO's tables; see docs/commands.md.
[Holidays]
State=

; ^ = Ctrl, ! = Alt, + = Shift, # = Windows. Leave a value blank to disable it.
[Hotkeys]
YearEnd=Insert
Today=^!d
QuarterEnd=^!q
FinancialYear=^!y
; Enable the searchable picker with Picker=^!Space after reviewing clipboard policy.
Picker=
; Excel formatting, off until given a key; each works only in EXCEL.EXE. Excel cannot undo
; these changes. See docs/commands.md. Example: ExcelAccounting=^+!a
ExcelAccounting=
ExcelThousands=
ExcelPercent=
ExcelDates=
ExcelColourCode=
ExcelCentreAcross=
; Value and formula changes, also off until given a key and also not undoable. Toggle sign,
; divide and multiply each reverse with a second press or the opposite shortcut.
ExcelToggleSign=
ExcelDivide1000=
ExcelMultiply1000=
ExcelCopyFormulas=
ExcelPasteFormulas=
; More formatting, also off until given a key. Indent and decimal places run Excel's own
; commands, so Ctrl + Z undoes them; the font colour cycle and autofit cannot be undone.
ExcelFontColour=
ExcelAutofitColumns=
ExcelAutofitRows=
ExcelIncreaseIndent=
ExcelDecreaseIndent=
ExcelIncreaseDecimal=
ExcelDecreaseDecimal=
; Lists the active cell's precedents and goes to each; changes nothing in the workbook.
ExcelPrecedents=
