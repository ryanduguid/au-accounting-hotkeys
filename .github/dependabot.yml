version: 2
updates:
  # The scripts have no package manifest, so only the pinned workflow actions
  # need updates. The AutoHotkey runtime is pinned by URL and SHA-256 in
  # check.yml and is moved by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Minor and patch action updates arrive as one pull request, so they need
      # one rebase and CI run instead of one each. Majors stay separate for review.
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
