name: Prepare source release

on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag on main's history
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  tests:
    needs: validate
    # check.yml and security.yml already test each pull request, so only a
    # tag repeats them here.
    if: github.event_name == 'push'
    # Both local syntaxes resolve the caller's commit. Keep compatibility with
    # Scorecard and the current stable actionlint parser.
    uses: ./.github/workflows/check.yml # zizmor: ignore[self-repository]

  security:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    # Keep the SARIF-producing actions explicit here so Scorecard can verify
    # that security-events: write is required by this workflow.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:actions
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1

  package:
    needs: [tests, security]
    # A pull request skips both and still previews the archive; a failed or
    # cancelled job above stops packaging.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive the tested commit and record its checksum
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          mkdir dist
          git -c core.autocrlf=false archive --format=zip --prefix=au-accounting-hotkeys/ \
            --output="dist/au-accounting-hotkeys-$RELEASE_TAG.zip" HEAD
          cd dist
          sha256sum ./*.zip > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-archive
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  attest:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      # This job consumes the archive without checking out or executing project code.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-archive
          path: dist
      - name: Verify the archive after downloading it
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Sign the archive's build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Include the verification bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: cp -- "$BUNDLE_PATH" "dist/au-accounting-hotkeys-$RELEASE_TAG.sigstore.json"
      - name: Save the signed release assets for maintainer publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release-gates:
    # The one context for branch protection to require from this workflow, so
    # add any new job to needs. It fails when a job fails or is cancelled. A pull
    # request skips tests, security and attest by design; any other skip follows
    # a failed or cancelled job. It checks out nothing, so it has no permissions.
    needs: [validate, tests, security, package, attest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
